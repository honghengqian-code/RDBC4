services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_DB: jobboard
      POSTGRES_USER: jobboard
      POSTGRES_PASSWORD: jobboard
    ports:
      - "5433:5432"
    volumes:
      - jobboard_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobboard -d jobboard"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    # backend/.env supplies secrets shared with local (non-Docker) dev
    # (SECRET_KEY, EMAIL_*); the values below override it with the
    # container-network addresses those defaults can't know about.
    env_file:
      - ./backend/.env
    environment:
      DEBUG: "False"
      ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
      CORS_ALLOWED_ORIGINS: "http://localhost"
      FRONTEND_URL: "http://localhost"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"

  celery:
    build: ./backend
    command: celery -A myproject worker --loglevel=info
    env_file:
      - ./backend/.env
    environment:
      DEBUG: "False"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      # The backend service already runs migrate/collectstatic on startup;
      # skip it here so both containers don't race each other.
      DJANGO_MANAGE: "0"
    volumes:
      - media_volume:/app/media
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the browser bundle — the public address nginx answers on.
        # Rebuild the image if this changes (e.g. a real domain in production).
        NEXT_PUBLIC_API_URL: http://localhost/api
    environment:
      # Server-side (SSR) fetches only — read at runtime, talks straight to
      # the backend over the Docker network instead of round-tripping nginx.
      API_URL: http://backend:8000/api
    depends_on:
      - backend
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/static:ro
      - media_volume:/media:ro
    depends_on:
      - backend
      - frontend

volumes:
  jobboard_pgdata:
  static_volume:
  media_volume:
  backend_logs:
